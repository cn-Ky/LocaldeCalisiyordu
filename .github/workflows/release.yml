name: Masaüstü Uygulamasını Derle ve Yayımla

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # ---------------------------------------------------------------------
  # LINUX — .deb paketi + taşınabilir AppImage
  # (Bu iş akışının Linux kısmı, Anthropic'in geliştirme ortamında elle
  # çalıştırılıp gerçek kurulum/kaldırma ile doğrulandı; adımlar buradan
  # birebir aktarıldı.)
  # ---------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-cpp
    steps:
      - uses: actions/checkout@v4

      - name: Bağımlılıkları kur
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools libqt6sql6-sqlite \
            libsqlite3-dev libsodium-dev cmake pkg-config libgl1-mesa-dev \
            librsvg2-bin fuse

      - name: Derle
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          make -j"$(nproc)"

      - name: Testleri çalıştır
        run: |
          cd build
          make core_tests -j"$(nproc)"
          LOCALDE_DB_PATH=/tmp/ci-test.sqlite ./core_tests

      - name: .deb paketi oluştur
        run: |
          cd build
          cpack -G DEB

      - name: AppImage için linuxdeploy indir
        run: |
          cd build
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage" -O linuxdeploy.AppImage
          wget -q "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage" -O linuxdeploy-plugin-qt.AppImage
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage

      - name: AppImage oluştur
        run: |
          cd build
          rm -rf AppDir
          DESTDIR=AppDir make install
          export QMAKE=/usr/bin/qmake6
          export EXTRA_QT_MODULES="Sql"
          export PATH="$PWD:$PATH"
          ./linuxdeploy.AppImage --appimage-extract-and-run \
            --appdir AppDir --plugin qt --output appimage \
            --icon-file=../packaging/linux/icons/icon-256.png \
            --desktop-file=AppDir/usr/share/applications/localde-calisiyordu.desktop
          mv Localde*.AppImage LocaldeCalisiyordu-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            desktop-cpp/build/*.deb
            desktop-cpp/build/*.AppImage

  # ---------------------------------------------------------------------
  # WINDOWS — taşınabilir .zip (windeployqt ile Qt DLL'leri gömülü)
  # NOT: Bu iş bu depoda gerçek bir Windows runner'ında hiç çalıştırılıp
  # doğrulanmadı (geliştirme ortamı yalnızca Linux). İlk çalıştırmada
  # (push/PR sonrası Actions sekmesinden) çıktıyı kontrol edin; küçük
  # ayarlamalar gerekebilir.
  # ---------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-cpp
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Qt6 kur
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          arch: win64_msvc2019_64

      - name: MSVC ortamını hazırla
        uses: ilammy/msvc-dev-cmd@v1

      - name: vcpkg ile libsodium kur
        run: |
          git clone https://github.com/microsoft/vcpkg
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg.exe install libsodium:x64-windows

      - name: Derle
        run: |
          mkdir build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\desktop-cpp\vcpkg\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
          ninja

      - name: Qt DLL'lerini ve libsodium'u topla (windeployqt)
        run: |
          mkdir dist
          copy build\localde-desktop.exe dist\
          windeployqt --release dist\localde-desktop.exe
          copy vcpkg\installed\x64-windows\bin\libsodium.dll dist\

      - name: Zip'le
        run: Compress-Archive -Path dist\* -DestinationPath LocaldeCalisiyordu-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: desktop-cpp/LocaldeCalisiyordu-windows-x64.zip

  # ---------------------------------------------------------------------
  # MACOS — .dmg (macdeployqt ile)
  # NOT: Bu iş de gerçek bir macOS runner'ında hiç çalıştırılıp
  # doğrulanmadı; aynı uyarı geçerli.
  # ---------------------------------------------------------------------
  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop-cpp
    steps:
      - uses: actions/checkout@v4

      - name: Qt6 kur
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"

      - name: libsodium kur
        run: brew install libsodium pkg-config

      - name: Derle
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j"$(sysctl -n hw.ncpu)"

      - name: .dmg oluştur (macdeployqt)
        run: |
          cd build
          macdeployqt localde-desktop.app -dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: desktop-cpp/build/*.dmg

  # ---------------------------------------------------------------------
  # RELEASE — bir "vX.Y.Z" etiketi push'landığında üç paketi de GitHub
  # Release'e ekler.
  # ---------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          files: |
            linux-packages/*
            windows-package/*
            macos-package/*
